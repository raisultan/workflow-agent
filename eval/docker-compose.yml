# The eval's local services (T11.7): Mattermost (with its Postgres), the mock Jira and the mock GitLab, on 127.0.0.1 only.
# Synthetic data only. Passwords and tokens are generated by `node eval/bootstrap.ts` into eval/.state/services.env (git-ignored);
# start them with:
#   docker compose -p workbench-eval -f eval/docker-compose.yml --env-file eval/.state/services.env up -d --build
# The workbench's container reaches them at host.docker.internal.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: ${EVAL_POSTGRES_PASSWORD:?run node eval/bootstrap.ts first}
      POSTGRES_DB: mattermost
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmuser -d mattermost"]
      interval: 2s
      timeout: 3s
      retries: 20

  mattermost:
    image: mattermost/mattermost-team-edition:9.11
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${EVAL_MATTERMOST_PORT:-8065}:8065"
    environment:
      TZ: UTC
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mmuser:${EVAL_POSTGRES_PASSWORD:?}@postgres:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: http://127.0.0.1:${EVAL_MATTERMOST_PORT:-8065}
      MM_SERVICESETTINGS_LISTENADDRESS: :8065
      MM_SERVICESETTINGS_ENABLEUSERACCESSTOKENS: "true"
      MM_SERVICESETTINGS_ENABLEBOTACCOUNTCREATION: "true"
      MM_TEAMSETTINGS_ENABLEOPENSERVER: "true"
      MM_LOGSETTINGS_CONSOLELEVEL: INFO
      MM_PLUGINSETTINGS_ENABLE: "false"

  mock-jira:
    build: { context: ., dockerfile: services/Dockerfile }
    restart: unless-stopped
    command: ["node", "services/mock-jira.ts"]
    ports:
      - "127.0.0.1:${EVAL_JIRA_PORT:-25411}:8080"
    environment:
      HOST: 0.0.0.0
      PORT: "8080"

  mock-gitlab:
    build: { context: ., dockerfile: services/Dockerfile }
    restart: unless-stopped
    command: ["node", "services/mock-gitlab.ts", "--seed", "repos"]
    ports:
      - "127.0.0.1:${EVAL_GITLAB_PORT:-8929}:8080"
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      MOCK_GITLAB_ROOT: /data/repos
      MOCK_GITLAB_TOKEN: ${EVAL_GITLAB_TOKEN:?run node eval/bootstrap.ts first}
      MOCK_GITLAB_PUBLIC_URL: http://host.docker.internal:${EVAL_GITLAB_PORT:-8929}
    tmpfs:
      - /data:uid=1000,gid=1000

volumes:
  postgres:
